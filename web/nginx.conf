server {
    listen 80;
    
    # 1. API Proxy Block
    # Requests like /api/token/create are routed to the 'api' service on port 3000
    location /api/ {
        # 'api' is the name of the Go API service in docker-compose
        # '3000' is the internal port of the Go API container
        proxy_pass http://api:3000;
        
        # Standard proxy headers for better security and logging
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. SPA Routing Block
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React Router: tries file/directory, then falls back to index.html
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}